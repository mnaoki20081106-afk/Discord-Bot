name: Cloudflare Worker CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/worker/**"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "apps/worker/**"
      - "package.json"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build --workspace @dsm/worker
      - name: Bundle Worker with Wrangler
        working-directory: apps/worker
        run: npx wrangler deploy --dry-run --outdir ../../.worker-dist
