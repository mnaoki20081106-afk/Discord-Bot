name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build server
        run: npm run build --workspace @dsm/server
      - name: Build dashboard
        run: npm run build --workspace @dsm/web
        env:
          VITE_API_BASE_URL: https://api.example.com
