name: Bot Factory CI

on:
  push:
    branches: ["main"]
    paths:
      - "factory/**"
      - ".github/workflows/bot-factory.yml"
      - ".github/workflows/factory-ci.yml"
  pull_request:
    paths:
      - "factory/**"
      - ".github/workflows/bot-factory.yml"
      - ".github/workflows/factory-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Node scripts
        run: node --check factory/scripts/select-provider.mjs
      - name: Check shell scripts
        run: |
          set -euo pipefail
          for file in factory/scripts/*.sh; do
            bash -n "$file"
          done
      - name: Test provider auto-selection
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/worker" "$tmp/node"
          printf '{}\n' > "$tmp/worker/wrangler.jsonc"
          printf '{}\n' > "$tmp/worker/package.json"
          printf '{}\n' > "$tmp/node/package.json"

          worker="$(node factory/scripts/select-provider.mjs auto auto "$tmp" worker)"
          node_result="$(node factory/scripts/select-provider.mjs auto auto "$tmp" node)"
          printf '%s\n' "$worker" | grep -Fx 'provider=cloudflare'
          printf '%s\n' "$worker" | grep -Fx 'runtime=worker'
          printf '%s\n' "$node_result" | grep -Fx 'provider=oracle'
          printf '%s\n' "$node_result" | grep -Fx 'runtime=node'
